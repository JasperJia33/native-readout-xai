model:
  name: resnet18_cbam
  num_classes: 9
  pretrained: true
  dropout: 0.5
  cbam_reduction: 16
  cbam_kernel_size: 7

data:
  path: data/LSWMD.pkl
  image_size: 64
  test_size: 0.2
  val_size: 0.15
  num_workers: 4
  split_mode: lot_group
  exclude_none: false
  max_samples_per_class: null
  cache_preprocessed: true

training:
  seed: 456
  batch_size: 32
  batch_size_eval: 64
  epochs: 50
  lr: 0.001
  optimizer: adam
  weight_decay: 0.0
  scheduler:
    type: reduce_on_plateau
    factor: 0.5
    patience: 5
  loss: cross_entropy
  focal_gamma: 2.0
  early_stop_patience: 10
  early_stop_metric: val_balanced_acc
  grad_clip_norm: 1.0
  mixed_precision: true

augmentation:
  enabled: true
  rotation_prob: 0.7
  flip_prob: 0.5
  noise_prob: 0.3
  noise_std: 0.05
  minority_boost: true
